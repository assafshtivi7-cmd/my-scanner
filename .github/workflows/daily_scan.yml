name: Daily Stock Scan

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # ← חיוני: מאמת את ה-checkout עצמו
          fetch-depth: 0                        # ← שולף את כל ההיסטוריה (מונע בעיות rebase)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance pandas numpy xlsxwriter openpyxl --retries 10

      - name: Run Scanner
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ ! -f last_run.json ]; then echo "{}" > last_run.json; fi
          python stock_scanner.py

      - name: Commit and Push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add last_run.json index.html
          
          # אם אין שינויים - יוצא בהצלחה (לא כשלון)
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          
          git commit -m "Update scores and dashboard [skip ci]"
          
          # Push ישיר עם token מוטמע ב-URL — הדרך האמינה ביותר
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
