name: Daily Stock Scan
on:
  schedule:
    - cron: '30 13 * * *' # 16:30 שעון ישראל
  workflow_dispatch: # כפתור הרצה ידנית

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # קריטי כדי שהבוט יוכל לעדכן את האתר
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # מוודא שהיסטוריית הקבצים מלאה למניעת שגיאות שמירה
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance pandas numpy xlsxwriter openpyxl --retries 10 --timeout 60
        
      - name: Run Scanner
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          # יוצר קובץ זיכרון אם הוא חסר כדי שהקוד לא יקרוס
          if [ ! -f last_run.json ]; then echo "{}" > last_run.json; fi
          python stock_scanner.py
        
      - name: Save progress & Update Website
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # הוספת שני הקבצים: הזיכרון (json) והאתר (html)
          git add last_run.json index.html
          # ביצוע שמירה רק אם היו שינויים, כדי למנוע שגיאות סרק
          git commit -m "Update scores and dashboard [skip ci]" || exit 0
          git push origin main
