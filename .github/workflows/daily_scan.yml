name: Daily Stock Scan
on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # הגדרת הרשאות ברמת ה-Job כדי לוודא שאין חסימה
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance pandas numpy xlsxwriter openpyxl --retries 10
        
      - name: Run Scanner
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ ! -f last_run.json ]; then echo "{}" > last_run.json; fi
          python stock_scanner.py
        
      - name: Force Push Update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add last_run.json index.html
          git commit -m "Update dashboard [skip ci]" || exit 0
          # שימוש בטוקן בתוך הכתובת כדי לעקוף שגיאות 128
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
